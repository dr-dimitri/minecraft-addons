name: Check and package birds
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: Python ${{ matrix.python-version }} / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            node-version: '20'
            upload-artifacts: false
          - python-version: '3.14'
            node-version: '24'
            upload-artifacts: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Check Python and Node runtimes
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 10), "Python 3.10+ required"'
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
          npm --version
      - name: Check add-on version and release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 scripts/check_release.py --tag "$RELEASE_TAG"
          else
            python3 scripts/check_release.py
          fi
      - name: Recreate bird packs and preview
        run: |
          python3 scripts/generate.py
          python3 scripts/preview.py
      - name: Test package and release metadata
        run: python3 -m unittest discover -s tests -v
      - name: Test bird behavior
        run: npm test
      - name: Check repeatable builds, archives and standalone source rebuild
        run: |
          python3 scripts/check_candidate.py
          python3 scripts/check_release.py
      - name: Reject generated drift, including untracked files
        run: |
          drift="$(git status --porcelain --untracked-files=all -- resource_pack behavior_pack docs/PREVIEW.svg)"
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            echo 'Commit regenerated product files before releasing.' >&2
            exit 1
          fi
      - name: Check archive hashes
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.upload-artifacts
        with:
          name: lumen-silent-birds
          path: |
            dist/Lumen-Silent-Birds-*.mcaddon
            dist/Lumen-Silent-Birds-Source-*.zip
            dist/Lumen-Tiefsee-Abenteuer-*.mcworld
            dist/SHA256SUMS.txt
          if-no-files-found: error
  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/birds-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate exact tag before creating release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release.py --tag "$RELEASE_TAG"
      - name: Download checked bird artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name lumen-silent-birds --dir release-assets
      - name: Verify complete asset set and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, os, re
          from pathlib import Path
          version = os.environ['RELEASE_TAG'].removeprefix('birds-v')
          expected = {f'Lumen-Silent-Birds-{version}.mcaddon', f'Lumen-Silent-Birds-Source-{version}.zip',
                      f'Lumen-Tiefsee-Abenteuer-{version}.mcworld'}
          directory = Path('release-assets')
          if {path.name for path in directory.iterdir()} != expected | {'SHA256SUMS.txt'}:
              raise SystemExit('Unexpected or missing release assets')
          checksums = {}
          for line in (directory / 'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines():
              match = re.fullmatch(r'([0-9a-f]{64})  (.+)', line)
              if match is None or match[2] not in expected or match[2] in checksums:
                  raise SystemExit('Invalid checksum manifest')
              checksums[match[2]] = match[1]
          if set(checksums) != expected:
              raise SystemExit('Incomplete checksum manifest')
          for name, digest in checksums.items():
              if hashlib.sha256((directory / name).read_bytes()).hexdigest() != digest:
                  raise SystemExit('Checksum mismatch: ' + name)
          PY
      - name: Create reviewable draft with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --draft --verify-tag --title "$RELEASE_TAG" \
            --notes 'Automatische Prüfungen erfolgreich. Vor Veröffentlichung die Windows-Abnahme und Release-Checkliste in docs/RELEASING.md prüfen.'
